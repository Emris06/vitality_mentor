name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to keep the queue short.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-typecheck-test:
    name: Lint / Typecheck / Audits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        continue-on-error: true
        run: pnpm lint

      - name: i18n audit
        run: pnpm i18n:audit

      - name: Security boundary audit
        run: pnpm security:audit

  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install AI service (with dev extras)
        working-directory: services/ai
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        run: pytest services/ai/tests -q

  latency-bench:
    name: Chat latency bench
    # Gate on main only — bench is informational on PRs would just be noise.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    # TODO: wire AI mock once stable; bench currently exits cleanly only
    # when chat returns within 2s. Until a deterministic stub is in place
    # this job is informational and won't block merges to main.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vitality
          POSTGRES_PASSWORD: vitality
          POSTGRES_DB: vitality
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vitality"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://vitality:vitality@localhost:5432/vitality
      REDIS_URL: redis://localhost:6379
      AI_SERVICE_URL: http://localhost:8000
      API_URL: http://localhost:4000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: pnpm --filter @vitality/api build

      - name: Start API in background
        run: |
          nohup pnpm --filter @vitality/api start > api.log 2>&1 &
          # Wait up to 30s for /health to come up.
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:4000/health >/dev/null 2>&1; then
              echo "api up after ${i}s"
              break
            fi
            sleep 1
          done

      - name: Run bench
        run: pnpm bench:chat -- --n=20

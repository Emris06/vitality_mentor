name: Deploy

# Production deploy pipeline. Runs only on push to `main` — PRs get a Vercel
# preview through Vercel's own GitHub integration, not this workflow.
#
# Job graph:
#   detect-changes ──┬─> deploy-web        ─┐
#                    ├─> deploy-api        ─┼─> smoke-test
#                    ├─> deploy-ai         ─┤
#                    └─> deploy-ispring-mock ┘
#
# Each Railway deploy is gated by a paths-filter so unrelated commits don't
# rebuild every service. The Vercel deploy always runs (web bundle is cheap
# and rewrites depend on env-var-driven URLs).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time per ref — prevents two pushes racing each other into
# Railway/Vercel and ending up with mismatched API/AI versions.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      ai: ${{ steps.filter.outputs.ai }}
      ispring: ${{ steps.filter.outputs.ispring }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'services/api/**'
              - 'packages/shared/**'
              - 'packages/synth-data/**'
            ai:
              - 'services/ai/**'
            ispring:
              - 'infra/mocks/ispring/**'

  deploy-web:
    name: Deploy web → Vercel
    runs-on: ubuntu-latest
    needs: detect-changes
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Pull Vercel project env
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/web
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build (Vercel)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/web
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy (Vercel)
        run: vercel deploy --prod --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/web
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  deploy-api:
    name: Deploy API → Railway
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Railway
        uses: bervProject/railway-deploy@main
        with:
          service: vitality-api
          railway_token: ${{ secrets.RAILWAY_TOKEN }}

  deploy-ai:
    name: Deploy AI → Railway
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.ai == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Railway
        uses: bervProject/railway-deploy@main
        with:
          service: vitality-ai
          railway_token: ${{ secrets.RAILWAY_TOKEN }}

  # Production should not run the mock long-term. Once real iSpring credentials
  # land, delete this job and the Railway service, and update the API's
  # ISPRING_BASE_URL to point at the real LMS. Tracked in infra/DEPLOY.md.
  # TODO: replace with real iSpring integration once API key is provisioned.
  deploy-ispring-mock:
    name: Deploy iSpring mock → Railway
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.ispring == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Railway
        uses: bervProject/railway-deploy@main
        with:
          service: vitality-ispring-mock
          railway_token: ${{ secrets.RAILWAY_TOKEN }}

  smoke-test:
    name: Smoke test public URLs
    runs-on: ubuntu-latest
    # `always()` so we still run if a service had no changes and was skipped.
    # `!cancelled()` would also do — pick `always()` to also surface failures
    # when one of the deploys fails (smoke will be red too, which is the
    # correct signal for the operator).
    needs: [deploy-web, deploy-api, deploy-ai, deploy-ispring-mock]
    if: always() && !cancelled()
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install root deps (tsx)
        run: pnpm install --frozen-lockfile=false --ignore-scripts

      - name: Run smoke script
        env:
          WEB_URL: ${{ vars.WEB_URL }}
          API_URL: ${{ vars.API_URL }}
          AI_URL: ${{ vars.AI_URL }}
        run: pnpm smoke:prod

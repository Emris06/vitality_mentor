name: vitality

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: vitality-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vitality
      POSTGRES_PASSWORD: vitality
      POSTGRES_DB: vitality
    ports:
      # 5433 avoids clashing with a local PostgreSQL install on Windows/macOS (5432).
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitality -d vitality"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: vitality-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: vitality-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: vitality
      MINIO_ROOT_PASSWORD: vitality-dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  api:
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    container_name: vitality-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: "4000"
      DATABASE_URL: postgres://vitality:vitality@postgres:5432/vitality
      REDIS_URL: redis://redis:6379
      AI_SERVICE_URL: http://ai:8000
      ISPRING_BASE_URL: http://ispring:4010
      WEB_ORIGIN: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ispring:
        condition: service_started
    ports:
      - "4000:4000"

  ispring:
    build:
      context: ../../infra/mocks/ispring
      dockerfile: Dockerfile
    container_name: vitality-ispring-mock
    restart: unless-stopped
    environment:
      PORT: "4010"
      HOST: 0.0.0.0
      MOCK_FAIL_RATE: "0"
    ports:
      - "4010:4010"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4010/api/v1/_health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6

  ai:
    build:
      context: ../..
      dockerfile: services/ai/Dockerfile
    container_name: vitality-ai
    restart: unless-stopped
    environment:
      AI_HOST: 0.0.0.0
      AI_PORT: "8000"
      DATABASE_URL: postgres://vitality:vitality@postgres:5432/vitality
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  postgres_data:
  redis_data:
  minio_data:

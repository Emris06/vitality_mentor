document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"061d621f-af2b-4fbc-b67b-81081fabad8f\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Instrument Serif';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"354f46da-6d96-4492-be24-d61281baad1f\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n\n<style>/* ===== Mentora — Intern surface ===== */\n\n:root {\n  --cobalt: #2046FF;\n  --cobalt-deep: #0F2BD9;\n  --cobalt-ink: #0a1857;\n  --cobalt-tint: #ECF0FF;\n  --cobalt-tint-2: #DCE3FF;\n  --cobalt-50: rgba(32, 70, 255, 0.06);\n  --cobalt-glow: rgba(32, 70, 255, 0.18);\n\n  --ink: #0A0E1F;\n  --ink-2: #1c2138;\n  --mute: #5E6478;\n  --mute-2: #8B92A8;\n  --mute-3: #B8BDCC;\n\n  --paper: #FAFAF7;\n  --surface: #FFFFFF;\n  --surface-2: #F4F4F0;\n  --line: #ECECE5;\n  --line-2: #DFDFD7;\n\n  --synth: #FF7A1A;\n  --synth-tint: #FFF1E5;\n  --good: #0B8F5C;\n  --good-tint: #E3F6EC;\n  --warn: #C58200;\n  --warn-tint: #FFF4DC;\n  --bad: #C8351C;\n  --bad-tint: #FCE9E4;\n\n  --font-sans: \"Geist\", ui-sans-serif, system-ui, sans-serif;\n  --font-mono: \"Geist Mono\", ui-monospace, \"SF Mono\", Menlo, monospace;\n  --font-serif: \"Instrument Serif\", \"Times New Roman\", serif;\n\n  --r-sm: 6px;\n  --r-md: 10px;\n  --r-lg: 14px;\n  --r-xl: 20px;\n\n  --shadow-sm: 0 1px 0 rgba(10,14,31,0.04), 0 1px 2px rgba(10,14,31,0.04);\n  --shadow-md: 0 1px 0 rgba(10,14,31,0.04), 0 8px 24px -8px rgba(10,14,31,0.10);\n  --shadow-lg: 0 1px 0 rgba(10,14,31,0.04), 0 24px 48px -16px rgba(10,14,31,0.18);\n  --shadow-cobalt: 0 1px 0 rgba(255,255,255,0.18) inset, 0 12px 28px -10px rgba(32,70,255,0.55);\n}\n\n* { box-sizing: border-box; }\nhtml, body { margin: 0; padding: 0; height: 100%; }\nbody {\n  font-family: var(--font-sans);\n  font-feature-settings: \"ss01\", \"cv11\";\n  color: var(--ink);\n  background: var(--paper);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n  overflow: hidden;\n}\n\nbutton { font: inherit; color: inherit; }\ninput, textarea, select { font: inherit; color: inherit; }\na { color: inherit; text-decoration: none; }\n\n/* ============ App shell ============ */\n\n.app {\n  display: grid;\n  grid-template-columns: 220px 1fr;\n  height: 100vh;\n  background: var(--paper);\n  position: relative;\n}\n\n.sidebar {\n  background: var(--surface);\n  border-right: 1px solid var(--line);\n  display: flex;\n  flex-direction: column;\n  padding: 22px 14px 16px;\n  gap: 22px;\n  position: relative;\n  z-index: 2;\n}\n\n.brand {\n  display: flex;\n  align-items: center;\n  gap: 9px;\n  padding: 0 6px;\n  height: 28px;\n}\n.brand-mark {\n  width: 22px;\n  height: 22px;\n  position: relative;\n  flex: 0 0 22px;\n}\n.brand-mark::before, .brand-mark::after,\n.brand-mark > i:nth-child(1), .brand-mark > i:nth-child(2) {\n  content: \"\";\n  position: absolute;\n  inset: 0;\n  background: var(--cobalt);\n  border-radius: 1px;\n}\n.brand-mark::before { transform: rotate(0deg) scaleX(1) scaleY(0.22); }\n.brand-mark::after  { transform: rotate(90deg) scaleX(1) scaleY(0.22); }\n.brand-mark > i:nth-child(1) { transform: rotate(45deg) scaleX(1) scaleY(0.22); }\n.brand-mark > i:nth-child(2) { transform: rotate(-45deg) scaleX(1) scaleY(0.22); }\n.brand-name {\n  font-size: 16px;\n  font-weight: 600;\n  letter-spacing: -0.015em;\n}\n.brand-name em {\n  color: var(--cobalt);\n  font-style: normal;\n}\n\n.nav-section {\n  display: flex;\n  flex-direction: column;\n  gap: 1px;\n}\n.nav-title {\n  font: 500 10px/1 var(--font-mono);\n  letter-spacing: 0.08em;\n  text-transform: uppercase;\n  color: var(--mute-2);\n  padding: 8px 8px 8px;\n}\n.nav-item {\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  padding: 7px 8px;\n  border-radius: var(--r-sm);\n  font-size: 13.5px;\n  color: var(--ink-2);\n  cursor: pointer;\n  border: 0;\n  background: transparent;\n  width: 100%;\n  text-align: left;\n  position: relative;\n}\n.nav-item:hover { background: var(--surface-2); }\n.nav-item.active {\n  background: var(--cobalt-tint);\n  color: var(--cobalt-ink);\n  font-weight: 500;\n}\n.nav-item.active .nav-icon { color: var(--cobalt); }\n.nav-item .nav-icon {\n  width: 16px;\n  height: 16px;\n  color: var(--mute);\n  flex: 0 0 16px;\n}\n.nav-item .nav-badge {\n  margin-left: auto;\n  font: 500 10px/1 var(--font-mono);\n  background: var(--ink);\n  color: white;\n  padding: 3px 5px;\n  border-radius: 4px;\n}\n.nav-item.active .nav-badge {\n  background: var(--cobalt);\n}\n\n.sidebar-foot {\n  margin-top: auto;\n  display: flex;\n  flex-direction: column;\n  gap: 10px;\n}\n\n.synth-tag {\n  display: inline-flex;\n  align-items: center;\n  gap: 6px;\n  padding: 6px 8px;\n  background: var(--synth-tint);\n  color: var(--synth);\n  border-radius: var(--r-sm);\n  font: 500 10px/1.1 var(--font-mono);\n  letter-spacing: 0.04em;\n  text-transform: uppercase;\n}\n.synth-tag::before {\n  content: \"\";\n  width: 6px;\n  height: 6px;\n  border-radius: 50%;\n  background: var(--synth);\n  box-shadow: 0 0 0 3px rgba(255,122,26,0.18);\n}\n\n.user-chip {\n  display: flex;\n  align-items: center;\n  gap: 9px;\n  padding: 7px 8px;\n  border-radius: var(--r-sm);\n  cursor: pointer;\n}\n.user-chip:hover { background: var(--surface-2); }\n.avatar {\n  width: 26px; height: 26px;\n  border-radius: 50%;\n  background: linear-gradient(135deg, #F4B860, #D7693B);\n  color: white;\n  display: grid; place-items: center;\n  font: 500 11px/1 var(--font-sans);\n  flex: 0 0 26px;\n}\n.avatar.cobalt { background: linear-gradient(135deg, #4f6bff, var(--cobalt-deep)); }\n.avatar.lilac  { background: linear-gradient(135deg, #b18cff, #6b46d9); }\n.avatar.teal   { background: linear-gradient(135deg, #5dd8c0, #1c8f7a); }\n.avatar.rose   { background: linear-gradient(135deg, #ff9aaa, #d7406a); }\n.user-meta { line-height: 1.2; }\n.user-meta b { font-size: 12.5px; font-weight: 500; display: block; }\n.user-meta span { font-size: 11px; color: var(--mute); }\n\n/* ============ Topbar ============ */\n\n.workspace {\n  display: flex;\n  flex-direction: column;\n  min-width: 0;\n  overflow: hidden;\n}\n\n.topbar {\n  height: 52px;\n  flex: 0 0 52px;\n  background: var(--surface);\n  border-bottom: 1px solid var(--line);\n  display: flex;\n  align-items: center;\n  padding: 0 20px;\n  gap: 16px;\n  z-index: 2;\n}\n\n.crumbs {\n  display: flex;\n  align-items: center;\n  gap: 8px;\n  font-size: 13px;\n  color: var(--mute);\n}\n.crumbs b { color: var(--ink); font-weight: 500; }\n.crumbs .sep { color: var(--mute-3); }\n\n.ptt-hint {\n  margin-left: auto;\n  display: inline-flex;\n  align-items: center;\n  gap: 8px;\n  padding: 5px 10px 5px 8px;\n  border-radius: 999px;\n  border: 1px solid var(--line-2);\n  background: var(--surface-2);\n  font: 500 11.5px/1 var(--font-sans);\n  color: var(--mute);\n  cursor: default;\n}\n.ptt-hint kbd {\n  font: 500 10.5px/1 var(--font-mono);\n  padding: 3px 6px;\n  background: var(--surface);\n  border: 1px solid var(--line-2);\n  border-bottom-width: 2px;\n  border-radius: 4px;\n  color: var(--ink-2);\n}\n.ptt-hint.live { color: var(--cobalt); border-color: var(--cobalt-glow); background: var(--cobalt-tint); }\n.ptt-hint.live kbd { border-color: var(--cobalt-glow); color: var(--cobalt); }\n\n.search {\n  display: inline-flex;\n  align-items: center;\n  gap: 8px;\n  height: 32px;\n  padding: 0 10px;\n  border-radius: var(--r-sm);\n  background: var(--surface-2);\n  color: var(--mute);\n  font-size: 13px;\n  border: 1px solid transparent;\n  min-width: 280px;\n  cursor: text;\n}\n.search:hover { border-color: var(--line-2); }\n.search kbd {\n  margin-left: auto;\n  font: 500 10.5px/1 var(--font-mono);\n  padding: 3px 5px;\n  background: var(--surface);\n  border: 1px solid var(--line-2);\n  border-radius: 4px;\n  color: var(--mute);\n}\n\n/* ============ Main content ============ */\n\n.main {\n  flex: 1 1 auto;\n  min-height: 0;\n  overflow: auto;\n  scrollbar-width: thin;\n}\n.main::-webkit-scrollbar { width: 10px; height: 10px; }\n.main::-webkit-scrollbar-thumb {\n  background: var(--line-2); border-radius: 5px; border: 2px solid transparent; background-clip: content-box;\n}\n\n.page {\n  max-width: 1240px;\n  margin: 0 auto;\n  padding: 28px 32px 48px;\n}\n\n/* ===== Headings ===== */\n.h-eyebrow {\n  font: 500 11px/1 var(--font-mono);\n  letter-spacing: 0.08em;\n  text-transform: uppercase;\n  color: var(--mute);\n  margin: 0 0 8px;\n}\n.h1 { font-size: 32px; font-weight: 500; letter-spacing: -0.025em; margin: 0; line-height: 1.1; }\n.h1 em { font-family: var(--font-serif); font-style: italic; font-weight: 400; color: var(--cobalt); }\n.h2 { font-size: 18px; font-weight: 500; letter-spacing: -0.01em; margin: 0; }\n.h3 { font-size: 14px; font-weight: 500; margin: 0; }\n.sub { color: var(--mute); font-size: 13px; line-height: 1.45; }\n\n/* ===== Cards ===== */\n.card {\n  background: var(--surface);\n  border: 1px solid var(--line);\n  border-radius: var(--r-lg);\n}\n.card-pad { padding: 18px 20px; }\n\n/* ============ Dashboard ============ */\n\n.dash-hero {\n  display: grid;\n  grid-template-columns: 1.7fr 1fr;\n  gap: 18px;\n  margin-bottom: 22px;\n  align-items: stretch;\n}\n\n.quest {\n  background: var(--cobalt);\n  color: white;\n  border-radius: var(--r-lg);\n  padding: 22px 24px;\n  position: relative;\n  overflow: hidden;\n  display: flex;\n  flex-direction: column;\n  gap: 14px;\n  box-shadow: var(--shadow-cobalt);\n}\n.quest::after {\n  content: \"\";\n  position: absolute;\n  right: -60px; top: -60px;\n  width: 240px; height: 240px;\n  background: radial-gradient(circle, rgba(255,255,255,0.18), transparent 70%);\n  border-radius: 50%;\n  pointer-events: none;\n}\n.quest-mark {\n  position: absolute;\n  right: 24px; top: 22px;\n  font: 400 14px/1 var(--font-mono);\n  opacity: 0.7;\n}\n.quest .eyebrow {\n  font: 500 11px/1 var(--font-mono);\n  letter-spacing: 0.08em;\n  text-transform: uppercase;\n  opacity: 0.7;\n}\n.quest h2 {\n  font-size: 24px;\n  font-weight: 500;\n  letter-spacing: -0.02em;\n  line-height: 1.15;\n  margin: 0;\n  max-width: 32ch;\n}\n.quest h2 em {\n  font-family: var(--font-serif);\n  font-style: italic;\n  font-weight: 400;\n}\n.quest-meta {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 16px;\n  font-size: 12.5px;\n  opacity: 0.85;\n  font-variant-numeric: tabular-nums;\n}\n.quest-meta b { font-weight: 500; }\n.quest-actions {\n  display: flex;\n  gap: 8px;\n  margin-top: 4px;\n}\n.btn {\n  display: inline-flex;\n  align-items: center;\n  gap: 7px;\n  height: 34px;\n  padding: 0 14px;\n  border-radius: var(--r-sm);\n  background: var(--ink);\n  color: white;\n  border: 0;\n  font: 500 13px/1 var(--font-sans);\n  cursor: pointer;\n  transition: transform 0.06s ease, background 0.15s ease;\n}\n.btn:hover { background: var(--ink-2); }\n.btn:active { transform: translateY(0.5px); }\n.btn-primary { background: var(--cobalt); }\n.btn-primary:hover { background: var(--cobalt-deep); }\n.btn-ghost { background: transparent; color: var(--ink-2); border: 1px solid var(--line-2); }\n.btn-ghost:hover { background: var(--surface-2); }\n.btn-light-on-cobalt { background: white; color: var(--cobalt); }\n.btn-light-on-cobalt:hover { background: var(--cobalt-tint); }\n.btn-ghost-on-cobalt { background: rgba(255,255,255,0.14); color: white; border: 1px solid rgba(255,255,255,0.28); }\n.btn-ghost-on-cobalt:hover { background: rgba(255,255,255,0.22); }\n\n.stats {\n  display: grid;\n  grid-template-rows: repeat(3, 1fr);\n  gap: 10px;\n}\n.stat {\n  background: var(--surface);\n  border: 1px solid var(--line);\n  border-radius: var(--r-lg);\n  padding: 14px 16px;\n  display: flex;\n  align-items: center;\n  gap: 14px;\n  position: relative;\n}\n.stat-icon {\n  width: 36px; height: 36px;\n  border-radius: 9px;\n  display: grid; place-items: center;\n  background: var(--cobalt-tint);\n  color: var(--cobalt);\n  flex: 0 0 36px;\n}\n.stat-icon.warm { background: #FFF1E5; color: var(--synth); }\n.stat-icon.green { background: var(--good-tint); color: var(--good); }\n.stat-value {\n  font: 500 22px/1 var(--font-sans);\n  letter-spacing: -0.02em;\n  font-variant-numeric: tabular-nums;\n}\n.stat-value small { font-size: 12px; color: var(--mute); margin-left: 4px; font-weight: 400; }\n.stat-label { color: var(--mute); font-size: 12px; margin-top: 3px; }\n\n.streak-dots { display: flex; gap: 3px; margin-top: 6px; }\n.streak-dots i {\n  width: 7px; height: 7px; border-radius: 50%;\n  background: var(--good);\n}\n.streak-dots i.miss { background: var(--line-2); }\n\n.section-head {\n  display: flex;\n  align-items: end;\n  justify-content: space-between;\n  margin: 28px 0 12px;\n  gap: 16px;\n}\n.section-head .h2 { letter-spacing: -0.015em; }\n.section-head a {\n  font-size: 12.5px;\n  color: var(--mute);\n  cursor: pointer;\n}\n.section-head a:hover { color: var(--cobalt); }\n\n.scenarios {\n  display: grid;\n  grid-template-columns: repeat(4, 1fr);\n  gap: 12px;\n}\n.scenario {\n  background: var(--surface);\n  border: 1px solid var(--line);\n  border-radius: var(--r-lg);\n  padding: 16px;\n  cursor: pointer;\n  display: flex;\n  flex-direction: column;\n  gap: 10px;\n  transition: border-color 0.15s, transform 0.06s;\n  position: relative;\n}\n.scenario:hover { border-color: var(--cobalt-glow); }\n.scenario:active { transform: translateY(0.5px); }\n.scenario.locked { opacity: 0.55; cursor: not-allowed; }\n.scenario-glyph {\n  width: 32px; height: 32px;\n  border-radius: 8px;\n  display: grid; place-items: center;\n  background: var(--cobalt-tint);\n  color: var(--cobalt);\n}\n.scenario-name {\n  font-size: 14px;\n  font-weight: 500;\n  letter-spacing: -0.005em;\n}\n.scenario-desc {\n  font-size: 12px;\n  color: var(--mute);\n  line-height: 1.4;\n}\n.scenario-foot {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  margin-top: auto;\n  padding-top: 8px;\n  border-top: 1px dashed var(--line);\n  font: 500 11px/1 var(--font-mono);\n  color: var(--mute);\n}\n.scenario-foot .score-pill {\n  padding: 3px 6px;\n  background: var(--good-tint);\n  color: var(--good);\n  border-radius: 4px;\n}\n.scenario-foot .new-pill {\n  padding: 3px 6px;\n  background: var(--cobalt-tint);\n  color: var(--cobalt);\n  border-radius: 4px;\n}\n\n/* ===== Two-column lower ===== */\n.dash-low {\n  display: grid;\n  grid-template-columns: 1.5fr 1fr;\n  gap: 18px;\n  margin-top: 22px;\n}\n\n.activity {\n  display: flex;\n  flex-direction: column;\n}\n.activity-row {\n  display: grid;\n  grid-template-columns: 24px 1fr auto;\n  align-items: center;\n  gap: 12px;\n  padding: 12px 4px;\n  border-bottom: 1px dashed var(--line);\n  font-size: 13px;\n}\n.activity-row:last-child { border-bottom: 0; }\n.activity-row .dot {\n  width: 8px; height: 8px; border-radius: 50%;\n  background: var(--cobalt); margin: 0 8px;\n}\n.activity-row .dot.green { background: var(--good); }\n.activity-row .dot.warm  { background: var(--synth); }\n.activity-row .dot.mute  { background: var(--mute-3); }\n.activity-row .when {\n  font: 400 11.5px/1 var(--font-mono);\n  color: var(--mute);\n}\n.activity-row b { font-weight: 500; }\n\n.badges-shelf {\n  display: grid;\n  grid-template-columns: repeat(3, 1fr);\n  gap: 10px;\n  padding: 14px;\n}\n.badge {\n  border: 1px solid var(--line);\n  border-radius: var(--r-md);\n  padding: 14px 10px 10px;\n  text-align: center;\n  display: flex; flex-direction: column;\n  gap: 6px;\n  align-items: center;\n  position: relative;\n}\n.badge.locked { opacity: 0.5; filter: grayscale(0.7); }\n.badge.locked::after {\n  content: \"🔒\"; font-size: 11px;\n  position: absolute; top: 6px; right: 6px;\n}\n.badge-glyph {\n  width: 44px; height: 44px; border-radius: 50%;\n  display: grid; place-items: center;\n  font-size: 20px;\n  background: linear-gradient(135deg, #ECF0FF, #DCE3FF);\n  color: var(--cobalt);\n  border: 1px solid var(--cobalt-tint-2);\n}\n.badge-glyph.gold { background: linear-gradient(135deg, #FFE9B8, #F4B860); color: #6F4A0C; border-color: #F4B860; }\n.badge-glyph.rose { background: linear-gradient(135deg, #FFD7E2, #F4709C); color: #6F0C2E; border-color: #F4709C; }\n.badge-glyph.teal { background: linear-gradient(135deg, #C7F1E6, #5DD8C0); color: #0C5F4A; border-color: #5DD8C0; }\n.badge-glyph.lilac { background: linear-gradient(135deg, #E2D6FF, #B18CFF); color: #3a1c75; border-color: #B18CFF; }\n.badge b { font-size: 12px; font-weight: 500; }\n.badge span { font-size: 10.5px; color: var(--mute); }\n\n/* ===== Cohort strip ===== */\n.cohort {\n  display: flex;\n  align-items: center;\n  gap: 12px;\n  padding: 12px 16px;\n  background: var(--surface);\n  border: 1px solid var(--line);\n  border-radius: var(--r-lg);\n  margin-top: 22px;\n}\n.cohort .stack { display: flex; }\n.cohort .stack .avatar { margin-left: -8px; border: 2px solid var(--surface); }\n.cohort .stack .avatar:first-child { margin-left: 0; }\n.cohort small { color: var(--mute); font-size: 12.5px; }\n\n/* ============ Simulator (Bank CRM faithful replica) ============ */\n\n.sim-shell {\n  height: 100%;\n  display: grid;\n  grid-template-rows: auto 1fr auto;\n  background: var(--surface-2);\n}\n\n.sim-band {\n  background: var(--ink);\n  color: white;\n  display: flex;\n  align-items: center;\n  gap: 14px;\n  padding: 8px 20px;\n  font: 500 11.5px/1 var(--font-mono);\n  letter-spacing: 0.02em;\n}\n.sim-band .pip { width: 7px; height: 7px; border-radius: 50%; background: var(--synth); box-shadow: 0 0 0 3px rgba(255,122,26,0.22); }\n.sim-band .crumbs-x { color: rgba(255,255,255,0.55); display: flex; gap: 8px; }\n.sim-band .crumbs-x b { color: white; font-weight: 500; }\n.sim-band .scenario-progress {\n  margin-left: auto;\n  display: flex;\n  align-items: center;\n  gap: 10px;\n}\n.sim-band .scenario-progress .bar {\n  width: 160px; height: 6px;\n  border-radius: 3px;\n  background: rgba(255,255,255,0.14);\n  overflow: hidden;\n}\n.sim-band .scenario-progress .bar > i {\n  display: block; height: 100%;\n  background: var(--cobalt);\n  border-radius: 3px;\n  transition: width 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);\n}\n\n.sim-body {\n  display: grid;\n  grid-template-columns: 220px 1fr 320px;\n  min-height: 0;\n}\n.sim-side {\n  background: var(--surface);\n  border-right: 1px solid var(--line);\n  padding: 16px 12px;\n  overflow: auto;\n}\n.sim-side h4 {\n  font: 500 10px/1 var(--font-mono);\n  letter-spacing: 0.08em;\n  text-transform: uppercase;\n  color: var(--mute-2);\n  padding: 6px 8px;\n  margin: 0 0 4px;\n}\n.sim-side .navx {\n  display: flex; align-items: center; gap: 10px;\n  padding: 7px 8px;\n  border-radius: var(--r-sm);\n  font-size: 12.5px;\n  color: var(--ink-2);\n  cursor: pointer;\n}\n.sim-side .navx.active { background: var(--cobalt-tint); color: var(--cobalt-ink); font-weight: 500; }\n.sim-side .navx:hover:not(.active) { background: var(--surface-2); }\n.sim-side .navx svg { width: 14px; height: 14px; color: var(--mute); }\n.sim-side .navx.active svg { color: var(--cobalt); }\n\n.sim-main {\n  overflow: auto;\n  padding: 20px 24px 100px;\n  background: var(--surface-2);\n}\n\n.sim-rail {\n  background: var(--surface);\n  border-left: 1px solid var(--line);\n  padding: 18px 16px;\n  overflow: auto;\n  display: flex; flex-direction: column; gap: 18px;\n}\n\n/* === CRM faithful styles === */\n.crm-card {\n  background: var(--surface);\n  border: 1px solid var(--line);\n  border-radius: var(--r-md);\n}\n.crm-head {\n  display: flex; align-items: center; gap: 12px;\n  padding: 14px 18px;\n  border-bottom: 1px solid var(--line);\n}\n.crm-head h3 {\n  font-size: 15px;\n  font-weight: 500;\n  letter-spacing: -0.005em;\n  margin: 0;\n}\n.crm-head .id {\n  font: 500 11px/1 var(--font-mono);\n  color: var(--mute);\n  padding: 3px 5px;\n  background: var(--surface-2);\n  border-radius: 4px;\n}\n.crm-head .right { margin-left: auto; display: flex; gap: 8px; }\n\n.crm-body { padding: 16px 18px; }\n.crm-grid {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 14px 22px;\n}\n.crm-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }\n.field {\n  display: flex; flex-direction: column;\n  gap: 5px;\n  position: relative;\n}\n.field label {\n  font: 500 10.5px/1 var(--font-mono);\n  letter-spacing: 0.05em;\n  text-transform: uppercase;\n  color: var(--mute-2);\n}\n.field .val {\n  font-size: 13.5px;\n  color: var(--ink);\n}\n.field .val.mono { font-family: var(--font-mono); font-weight: 500; }\n.field input, .field select {\n  height: 32px;\n  padding: 0 10px;\n  border: 1px solid var(--line-2);\n  border-radius: var(--r-sm);\n  background: var(--surface);\n  font-size: 13px;\n}\n.field input:focus, .field select:focus {\n  outline: 0;\n  border-color: var(--cobalt);\n  box-shadow: 0 0 0 3px var(--cobalt-50);\n}\n.field input.warn { border-color: var(--warn); background: var(--warn-tint); }\n.field input.ok { border-color: var(--good); }\n.field .hint {\n  font-size: 11px;\n  color: var(--mute);\n}\n.field .hint.warn { color: var(--warn); }\n.field .hint.ok { color: var(--good); }\n\n.tag {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 3px 7px;\n  font: 500 11px/1.4 var(--font-sans);\n  border-radius: 4px;\n}\n.tag.cobalt { background: var(--cobalt-tint); color: var(--cobalt); }\n.tag.good { background: var(--good-tint); color: var(--good); }\n.tag.warn { background: var(--warn-tint); color: var(--warn); }\n.tag.bad { background: var(--bad-tint); color: var(--bad); }\n.tag.mute { background: var(--surface-2); color: var(--mute); }\n\n/* Doc upload widget */\n.doc-row {\n  display: grid;\n  grid-template-columns: 36px 1fr auto;\n  gap: 12px;\n  align-items: center;\n  padding: 10px 12px;\n  border: 1px solid var(--line);\n  border-radius: var(--r-md);\n  background: var(--surface);\n}\n.doc-row + .doc-row { margin-top: 8px; }\n.doc-thumb {\n  width: 36px; height: 44px;\n  background: var(--surface-2);\n  border-radius: 4px;\n  border: 1px solid var(--line);\n  position: relative;\n  overflow: hidden;\n}\n.doc-thumb::before, .doc-thumb::after {\n  content: \"\";\n  position: absolute;\n  left: 4px; right: 4px;\n  height: 2px; background: var(--line-2); border-radius: 1px;\n}\n.doc-thumb::before { top: 18px; }\n.doc-thumb::after { top: 24px; right: 14px; }\n.doc-meta b { font-size: 13px; font-weight: 500; display: block; }\n.doc-meta span { font-size: 11.5px; color: var(--mute); }\n.doc-row.uploaded .doc-thumb { background: var(--cobalt-tint); border-color: var(--cobalt-tint-2); }\n\n/* Scenario steps panel (rail) */\n.steps-panel h4 {\n  font: 500 10.5px/1 var(--font-mono);\n  letter-spacing: 0.08em;\n  text-transform: uppercase;\n  color: var(--mute);\n  margin: 0 0 12px;\n}\n.step {\n  display: grid;\n  grid-template-columns: 20px 1fr auto;\n  align-items: start;\n  gap: 10px;\n  padding: 8px 0;\n  font-size: 13px;\n}\n.step + .step { border-top: 1px dashed var(--line); }\n.step .marker {\n  width: 18px; height: 18px;\n  border-radius: 50%;\n  border: 1.5px solid var(--line-2);\n  display: grid; place-items: center;\n  margin-top: 1px;\n  font: 500 10px/1 var(--font-mono);\n  color: var(--mute);\n  background: var(--surface);\n}\n.step.done .marker { background: var(--good); border-color: var(--good); color: white; }\n.step.active .marker { border-color: var(--cobalt); color: var(--cobalt); background: var(--cobalt-tint); }\n.step.error .marker { background: var(--bad); border-color: var(--bad); color: white; }\n.step b { font-weight: 500; display: block; }\n.step span { color: var(--mute); font-size: 11.5px; }\n.step .pts {\n  font: 500 11px/1.6 var(--font-mono);\n  color: var(--good);\n}\n.step.error .pts { color: var(--bad); }\n.step.pending .pts { color: var(--mute-3); }\n\n/* Hint card */\n.hint-card {\n  padding: 14px;\n  background: linear-gradient(180deg, #F6F8FF, #ECF0FF);\n  border: 1px solid var(--cobalt-tint-2);\n  border-radius: var(--r-md);\n  display: flex; flex-direction: column; gap: 8px;\n}\n.hint-card h5 {\n  font: 500 11px/1 var(--font-mono);\n  letter-spacing: 0.08em;\n  text-transform: uppercase;\n  color: var(--cobalt);\n  margin: 0;\n  display: flex; align-items: center; gap: 6px;\n}\n.hint-card p {\n  font-size: 12.5px;\n  line-height: 1.45;\n  color: var(--ink-2);\n  margin: 0;\n}\n\n/* Bottom action bar */\n.sim-foot {\n  display: flex; align-items: center;\n  gap: 12px;\n  padding: 12px 20px;\n  background: var(--surface);\n  border-top: 1px solid var(--line);\n}\n.sim-foot .left {\n  font: 500 12px/1.4 var(--font-mono);\n  color: var(--mute);\n}\n.sim-foot .left b { color: var(--ink); }\n.sim-foot .spacer { flex: 1; }\n\n/* ============ Clicky mascot ============ */\n\n.clicky-wrap {\n  position: fixed;\n  z-index: 30;\n  pointer-events: none;\n  transform: translate(-50%, -50%);\n  transition: opacity 0.25s ease;\n}\n\n.clicky {\n  width: 56px;\n  height: 56px;\n  border-radius: 50%;\n  background: radial-gradient(circle at 32% 30%, #6F8AFF, var(--cobalt) 55%, var(--cobalt-deep) 100%);\n  box-shadow:\n    0 0 0 6px rgba(32,70,255,0.10),\n    0 0 0 14px rgba(32,70,255,0.04),\n    0 12px 28px -10px rgba(32,70,255,0.55);\n  position: relative;\n  display: grid;\n  place-items: center;\n  color: white;\n  animation: clicky-bob 4s ease-in-out infinite;\n}\n@keyframes clicky-bob {\n  0%, 100% { transform: translateY(0); }\n  50% { transform: translateY(-3px); }\n}\n.clicky.listening {\n  box-shadow:\n    0 0 0 8px rgba(32,70,255,0.18),\n    0 0 0 18px rgba(32,70,255,0.06),\n    0 12px 28px -10px rgba(32,70,255,0.7);\n  animation: clicky-pulse 1.2s ease-in-out infinite;\n}\n@keyframes clicky-pulse {\n  0%, 100% { box-shadow: 0 0 0 8px rgba(32,70,255,0.2), 0 0 0 18px rgba(32,70,255,0.06), 0 12px 28px -10px rgba(32,70,255,0.7); }\n  50% { box-shadow: 0 0 0 12px rgba(32,70,255,0.28), 0 0 0 24px rgba(32,70,255,0.08), 0 12px 28px -10px rgba(32,70,255,0.7); }\n}\n.clicky-burst {\n  position: relative;\n  width: 22px; height: 22px;\n}\n.clicky-burst i {\n  position: absolute;\n  inset: 0;\n  background: white;\n  border-radius: 1.5px;\n}\n.clicky-burst i:nth-child(1) { transform: rotate(0deg) scaleY(0.20); }\n.clicky-burst i:nth-child(2) { transform: rotate(45deg) scaleY(0.20); }\n.clicky-burst i:nth-child(3) { transform: rotate(90deg) scaleY(0.20); }\n.clicky-burst i:nth-child(4) { transform: rotate(-45deg) scaleY(0.20); }\n\n.clicky-bubble {\n  position: absolute;\n  left: 64px;\n  top: 50%;\n  transform: translateY(-50%);\n  background: white;\n  border: 1px solid var(--line);\n  border-radius: 14px;\n  padding: 12px 14px;\n  box-shadow: var(--shadow-lg);\n  pointer-events: auto;\n  width: 280px;\n  font-size: 13px;\n  color: var(--ink);\n  line-height: 1.45;\n  animation: bubble-in 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);\n}\n@keyframes bubble-in {\n  from { opacity: 0; transform: translateY(-50%) translateX(-6px); }\n  to { opacity: 1; transform: translateY(-50%) translateX(0); }\n}\n.clicky-bubble::before {\n  content: \"\";\n  position: absolute;\n  left: -7px; top: 50%;\n  transform: translateY(-50%) rotate(45deg);\n  width: 12px; height: 12px;\n  background: white;\n  border-left: 1px solid var(--line);\n  border-bottom: 1px solid var(--line);\n}\n.clicky-bubble .who {\n  font: 500 10.5px/1 var(--font-mono);\n  letter-spacing: 0.06em;\n  text-transform: uppercase;\n  color: var(--cobalt);\n  display: flex; align-items: center; gap: 6px;\n  margin-bottom: 6px;\n}\n.clicky-bubble .who .live { width: 6px; height: 6px; border-radius: 50%; background: var(--cobalt); }\n.clicky-bubble p { margin: 0; }\n.clicky-bubble p b { font-weight: 500; }\n.clicky-bubble .actions {\n  display: flex; gap: 6px;\n  margin-top: 10px;\n}\n.clicky-bubble .pill {\n  font: 500 11px/1 var(--font-sans);\n  padding: 5px 9px;\n  border-radius: 999px;\n  background: var(--cobalt-tint);\n  color: var(--cobalt);\n  border: 0;\n  cursor: pointer;\n}\n.clicky-bubble .pill:hover { background: var(--cobalt-tint-2); }\n.clicky-bubble .pill.muted { background: var(--surface-2); color: var(--mute); }\n\n/* Voice waveform when listening */\n.wave {\n  display: inline-flex; align-items: center; gap: 2px; height: 14px;\n  margin-left: 6px;\n}\n.wave i {\n  display: block;\n  width: 2px;\n  background: var(--cobalt);\n  border-radius: 1px;\n  animation: wave 0.9s ease-in-out infinite;\n}\n.wave i:nth-child(1) { height: 6px;  animation-delay: 0s; }\n.wave i:nth-child(2) { height: 10px; animation-delay: 0.1s; }\n.wave i:nth-child(3) { height: 14px; animation-delay: 0.2s; }\n.wave i:nth-child(4) { height: 8px;  animation-delay: 0.3s; }\n.wave i:nth-child(5) { height: 12px; animation-delay: 0.15s; }\n.wave i:nth-child(6) { height: 6px;  animation-delay: 0.25s; }\n@keyframes wave {\n  0%, 100% { transform: scaleY(0.5); }\n  50% { transform: scaleY(1.3); }\n}\n\n/* Highlight ring on data-clicky-target */\n.clicky-highlight {\n  position: fixed;\n  border: 2px solid var(--cobalt);\n  background: rgba(32,70,255,0.06);\n  border-radius: 8px;\n  pointer-events: none;\n  z-index: 28;\n  box-shadow: 0 0 0 6px rgba(32,70,255,0.10);\n  transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);\n  animation: hl-pulse 1.6s ease-in-out infinite;\n}\n@keyframes hl-pulse {\n  0%, 100% { box-shadow: 0 0 0 6px rgba(32,70,255,0.10); }\n  50% { box-shadow: 0 0 0 10px rgba(32,70,255,0.18); }\n}\n\n/* ============ Chat widget ============ */\n\n.chat-fab {\n  position: fixed;\n  right: 22px; bottom: 22px;\n  z-index: 40;\n  height: 44px;\n  padding: 0 16px 0 14px;\n  border-radius: 999px;\n  background: var(--ink);\n  color: white;\n  border: 0;\n  font: 500 13px/1 var(--font-sans);\n  cursor: pointer;\n  display: inline-flex;\n  align-items: center;\n  gap: 9px;\n  box-shadow: var(--shadow-lg);\n}\n.chat-fab:hover { background: var(--ink-2); }\n.chat-fab .dot {\n  width: 6px; height: 6px; border-radius: 50%;\n  background: var(--good); box-shadow: 0 0 0 3px rgba(11,143,92,0.22);\n}\n\n.chat-panel {\n  position: fixed;\n  right: 22px; bottom: 22px;\n  width: 380px;\n  height: 540px;\n  background: var(--surface);\n  border-radius: var(--r-lg);\n  box-shadow: var(--shadow-lg);\n  display: flex;\n  flex-direction: column;\n  z-index: 40;\n  border: 1px solid var(--line);\n  overflow: hidden;\n  animation: chat-in 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);\n}\n@keyframes chat-in {\n  from { opacity: 0; transform: translateY(12px) scale(0.98); }\n  to { opacity: 1; transform: translateY(0) scale(1); }\n}\n\n.chat-hd {\n  padding: 14px 16px;\n  border-bottom: 1px solid var(--line);\n  display: flex;\n  align-items: center;\n  gap: 10px;\n}\n.chat-hd .pulse {\n  width: 8px; height: 8px; border-radius: 50%;\n  background: var(--cobalt); box-shadow: 0 0 0 4px var(--cobalt-tint);\n}\n.chat-hd b { font-size: 14px; font-weight: 500; }\n.chat-hd small { font-size: 11.5px; color: var(--mute); display: block; }\n.chat-hd .close {\n  margin-left: auto;\n  width: 28px; height: 28px;\n  border-radius: 6px;\n  border: 0; background: transparent;\n  color: var(--mute);\n  display: grid; place-items: center;\n  cursor: pointer;\n}\n.chat-hd .close:hover { background: var(--surface-2); color: var(--ink); }\n\n.chat-body {\n  flex: 1; min-height: 0;\n  overflow: auto;\n  padding: 16px;\n  display: flex;\n  flex-direction: column;\n  gap: 12px;\n  background: var(--paper);\n}\n.chat-msg {\n  max-width: 88%;\n  font-size: 13px;\n  line-height: 1.5;\n}\n.chat-msg.user {\n  align-self: flex-end;\n  background: var(--cobalt);\n  color: white;\n  padding: 9px 12px;\n  border-radius: 14px 14px 4px 14px;\n}\n.chat-msg.bot {\n  background: var(--surface);\n  border: 1px solid var(--line);\n  color: var(--ink);\n  padding: 11px 13px;\n  border-radius: 4px 14px 14px 14px;\n}\n.chat-msg.bot p { margin: 0 0 8px; }\n.chat-msg.bot p:last-child { margin: 0; }\n.chat-msg.bot .cite {\n  display: inline-flex;\n  align-items: center;\n  gap: 5px;\n  font: 500 10.5px/1 var(--font-mono);\n  padding: 3px 6px;\n  margin: 0 3px 4px 0;\n  background: var(--cobalt-tint);\n  color: var(--cobalt);\n  border-radius: 4px;\n  vertical-align: middle;\n}\n.chat-msg.bot .sources {\n  margin-top: 8px;\n  padding-top: 8px;\n  border-top: 1px dashed var(--line);\n  display: flex;\n  flex-wrap: wrap;\n  gap: 4px;\n}\n.chat-msg.bot .sources-label {\n  font: 500 10px/1 var(--font-mono);\n  letter-spacing: 0.05em;\n  text-transform: uppercase;\n  color: var(--mute);\n  width: 100%;\n  margin-bottom: 4px;\n}\n.chat-msg.typing {\n  display: inline-flex;\n  gap: 4px;\n  padding: 12px 14px;\n  background: var(--surface);\n  border: 1px solid var(--line);\n  border-radius: 4px 14px 14px 14px;\n  width: fit-content;\n}\n.chat-msg.typing i {\n  width: 6px; height: 6px; border-radius: 50%;\n  background: var(--mute-2);\n  animation: tdot 1s ease-in-out infinite;\n}\n.chat-msg.typing i:nth-child(2) { animation-delay: 0.12s; }\n.chat-msg.typing i:nth-child(3) { animation-delay: 0.24s; }\n@keyframes tdot {\n  0%, 100% { transform: translateY(0); opacity: 0.4; }\n  50% { transform: translateY(-4px); opacity: 1; }\n}\n\n.chat-suggest {\n  display: flex; flex-wrap: wrap; gap: 6px;\n  padding: 0 16px 12px;\n  background: var(--paper);\n}\n.chat-suggest button {\n  font: 500 11.5px/1 var(--font-sans);\n  background: var(--surface);\n  border: 1px solid var(--line);\n  border-radius: 999px;\n  padding: 6px 10px;\n  cursor: pointer;\n  color: var(--ink-2);\n}\n.chat-suggest button:hover { background: var(--cobalt-tint); color: var(--cobalt); border-color: var(--cobalt-tint-2); }\n\n.chat-input {\n  display: flex;\n  gap: 8px;\n  padding: 12px;\n  border-top: 1px solid var(--line);\n  background: var(--surface);\n  align-items: center;\n}\n.chat-input input {\n  flex: 1;\n  height: 34px;\n  padding: 0 12px;\n  border: 1px solid var(--line-2);\n  border-radius: var(--r-sm);\n  background: var(--surface);\n  font-size: 13px;\n}\n.chat-input input:focus {\n  outline: 0;\n  border-color: var(--cobalt);\n  box-shadow: 0 0 0 3px var(--cobalt-50);\n}\n.chat-input button {\n  height: 34px; width: 34px;\n  border-radius: var(--r-sm);\n  background: var(--cobalt);\n  color: white;\n  border: 0;\n  display: grid; place-items: center;\n  cursor: pointer;\n}\n.chat-input button:disabled { background: var(--mute-3); cursor: not-allowed; }\n.chat-input .lang {\n  display: inline-flex; align-items: center; gap: 4px;\n  font: 500 10.5px/1 var(--font-mono);\n  color: var(--mute);\n  border: 1px solid var(--line-2);\n  border-radius: var(--r-sm);\n  padding: 0 7px;\n  height: 34px;\n  cursor: pointer;\n  background: var(--surface);\n}\n.chat-input .lang:hover { color: var(--cobalt); border-color: var(--cobalt-tint-2); }\n\n/* ============ Results screen ============ */\n\n.results {\n  display: grid;\n  grid-template-columns: 1fr 360px;\n  gap: 22px;\n}\n\n.score-hero {\n  background: linear-gradient(160deg, #fff 0%, var(--cobalt-tint) 100%);\n  border: 1px solid var(--cobalt-tint-2);\n  border-radius: var(--r-xl);\n  padding: 32px;\n  position: relative;\n  overflow: hidden;\n}\n.score-hero::after {\n  content: \"\";\n  position: absolute;\n  right: -80px; bottom: -80px;\n  width: 280px; height: 280px;\n  background: radial-gradient(circle, var(--cobalt-glow), transparent 70%);\n  border-radius: 50%;\n}\n.score-number {\n  font: 500 96px/1 var(--font-sans);\n  letter-spacing: -0.05em;\n  color: var(--cobalt);\n  font-feature-settings: \"tnum\";\n}\n.score-number small {\n  font-size: 28px;\n  color: var(--cobalt);\n  opacity: 0.5;\n  letter-spacing: -0.02em;\n  margin-left: 4px;\n}\n.score-grade {\n  display: inline-flex;\n  padding: 4px 10px;\n  border-radius: 999px;\n  background: var(--good);\n  color: white;\n  font: 500 12px/1 var(--font-mono);\n  letter-spacing: 0.04em;\n  text-transform: uppercase;\n  margin-bottom: 16px;\n}\n.breakdown { display: flex; flex-direction: column; gap: 14px; margin-top: 24px; position: relative; z-index: 1; }\n.bd-row {\n  display: grid;\n  grid-template-columns: 1fr 200px auto;\n  gap: 16px;\n  align-items: center;\n  font-size: 13.5px;\n}\n.bd-row .meter {\n  height: 6px;\n  background: rgba(32,70,255,0.10);\n  border-radius: 3px;\n  overflow: hidden;\n}\n.bd-row .meter > i {\n  display: block; height: 100%;\n  background: var(--cobalt);\n  border-radius: 3px;\n  transition: width 1s cubic-bezier(0.2, 0.8, 0.2, 1);\n}\n.bd-row .meter > i.warn { background: var(--warn); }\n.bd-row .meter > i.bad { background: var(--bad); }\n.bd-row .pts {\n  font: 500 12.5px/1 var(--font-mono);\n  color: var(--mute);\n  text-align: right;\n}\n\n.results-side { display: flex; flex-direction: column; gap: 14px; }\n.xp-burst {\n  background: var(--ink);\n  color: white;\n  border-radius: var(--r-lg);\n  padding: 22px 22px 18px;\n  text-align: left;\n  position: relative;\n  overflow: hidden;\n}\n.xp-burst small { font: 500 11px/1 var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.6; }\n.xp-burst .num {\n  font: 500 48px/1 var(--font-sans);\n  letter-spacing: -0.03em;\n  margin-top: 6px;\n  display: flex;\n  align-items: baseline;\n  gap: 6px;\n}\n.xp-burst .num em {\n  font-family: var(--font-serif);\n  font-style: italic;\n  font-weight: 400;\n  color: var(--cobalt);\n  font-size: 32px;\n}\n.xp-burst .levelbar {\n  margin-top: 14px;\n  height: 6px;\n  border-radius: 3px;\n  background: rgba(255,255,255,0.14);\n  overflow: hidden;\n}\n.xp-burst .levelbar > i {\n  display: block; height: 100%; background: var(--cobalt);\n  width: 68%;\n}\n.xp-burst .levelmeta {\n  margin-top: 8px;\n  font: 500 11.5px/1.4 var(--font-mono);\n  color: rgba(255,255,255,0.6);\n  display: flex; justify-content: space-between;\n}\n\n.new-badge {\n  border: 1px solid var(--cobalt-tint-2);\n  background: linear-gradient(180deg, #fff, var(--cobalt-tint));\n  border-radius: var(--r-lg);\n  padding: 16px;\n  display: flex;\n  align-items: center;\n  gap: 14px;\n}\n.new-badge .glyph {\n  width: 52px; height: 52px;\n  border-radius: 50%;\n  display: grid; place-items: center;\n  font-size: 26px;\n  background: linear-gradient(135deg, #FFE9B8, #F4B860);\n  color: #6F4A0C;\n  border: 1px solid #F4B860;\n  flex: 0 0 52px;\n}\n.new-badge b { font-size: 14px; font-weight: 500; display: block; }\n.new-badge small { font-size: 12px; color: var(--mute); }\n.new-badge em {\n  font-family: var(--font-serif);\n  font-style: italic;\n  color: var(--cobalt);\n}\n\n.results-actions {\n  display: flex; gap: 10px;\n  margin-top: 24px;\n}\n\n/* mistakes review */\n.mistake {\n  padding: 14px 16px;\n  border: 1px solid var(--line);\n  border-left: 3px solid var(--warn);\n  border-radius: var(--r-md);\n  background: var(--surface);\n}\n.mistake + .mistake { margin-top: 10px; }\n.mistake.bad { border-left-color: var(--bad); }\n.mistake b { font-size: 13.5px; font-weight: 500; display: block; }\n.mistake p { font-size: 12.5px; color: var(--mute); margin: 4px 0 0; line-height: 1.45; }\n.mistake .corr {\n  margin-top: 8px;\n  font-size: 12px;\n  background: var(--cobalt-tint);\n  color: var(--cobalt-ink);\n  padding: 6px 8px;\n  border-radius: 6px;\n}\n.mistake .corr b { color: var(--cobalt); display: inline; font-size: 12px; }\n\n/* Empty / placeholder helpers */\n.pl-img {\n  background: repeating-linear-gradient(135deg,\n    var(--surface-2) 0 8px,\n    var(--surface) 8px 16px);\n  border: 1px dashed var(--line-2);\n  border-radius: var(--r-md);\n  display: grid; place-items: center;\n  color: var(--mute);\n  font: 500 11px/1 var(--font-mono);\n  text-transform: uppercase;\n  letter-spacing: 0.06em;\n}\n\n/* ===== Compact density override ===== */\n.app.density-compact .page { padding: 18px 22px 32px; }\n.app.density-compact .scenarios { gap: 8px; }\n.app.density-compact .scenario { padding: 12px; }\n.app.density-compact .crm-body { padding: 12px 14px; }\n.app.density-compact .crm-grid { gap: 10px 18px; }\n.app.density-compact .sim-main { padding: 14px 18px 80px; }\n.app.density-comfy .crm-body { padding: 20px 24px; }\n.app.density-comfy .crm-grid { gap: 18px 26px; }\n\n/* ===== Custom focus / selection ===== */\n::selection { background: var(--cobalt-glow); color: var(--cobalt-deep); }\n\n/* Subtle entrance for screens */\n.screen-in {\n  animation: screen-in 0.3s ease-out;\n}\n@keyframes screen-in {\n  from { opacity: 0; transform: translateY(4px); }\n  to { opacity: 1; transform: translateY(0); }\n}\n<\u002Fstyle>\n\n<script src=\"e648e376-2652-4a6f-9a05-c20408cb147c\" integrity=\"sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L\" crossorigin=\"anonymous\"><\u002Fscript>\n<script src=\"https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js\" integrity=\"sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm\" crossorigin=\"anonymous\"><\u002Fscript>\n<script src=\"https://unpkg.com/@babel/standalone@7.29.0/babel.min.js\" integrity=\"sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y\" crossorigin=\"anonymous\"><\u002Fscript>\n<\u002Fhead>\n<body>\n\n\n<div id=\"root\"><\u002Fdiv>\n\n<script type=\"text/babel\" src=\"693a0a4c-42eb-4c08-b386-3603dabc39ca\"><\u002Fscript>\n<script type=\"text/babel\" src=\"9d7cf1ae-9336-4cf9-a4ba-fcfc876d1a08\"><\u002Fscript>\n<script type=\"text/babel\" src=\"da9be4af-cfb8-4c46-8d1c-45de1e078c9f\"><\u002Fscript>\n<script type=\"text/babel\" src=\"eed9f78c-2dcc-48ab-9cee-21bcdda7833c\"><\u002Fscript>\n<script type=\"text/babel\" src=\"7a6c4bb7-7ce0-4c94-9b85-448387e1bb44\"><\u002Fscript>\n<script type=\"text/babel\" src=\"3985531d-534c-445f-a2fc-6d3d7e0bc6a8\"><\u002Fscript>\n<script type=\"text/babel\" src=\"0e527f15-f105-4e4c-bb48-30dc68718318\"><\u002Fscript>\n<script type=\"text/babel\" src=\"04999d82-cac3-44f5-b386-3044b74dd76f\"><\u002Fscript>\n<script type=\"text/babel\" src=\"8741e6a4-a733-4a83-afc9-a5a8ebf4aaff\"><\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"

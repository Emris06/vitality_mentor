[project]
name = "vitality-ai"
version = "0.0.0"
description = "Vitality AI service: RAG, simulator hints, skills forecasting"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "pydantic>=2.8.2",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.2",
    "psycopg[binary,pool]>=3.2.1",
    "redis>=5.0.8",
    "sentence-transformers>=3.0.1",
    "numpy>=1.26.4",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.4",
    "pytest>=8.3.2",
    "pytest-asyncio>=0.24.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
